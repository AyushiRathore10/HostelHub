<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub - My Complaints</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>

<div class="dashboard-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>🏢 HostelHub</h2>
            <span class="role-badge">Student Portal</span>
        </div>
        <nav class="sidebar-menu">
            <a href="dashboard.html"  class="nav-item">📊 Dashboard</a>
            <a href="room.html"       class="nav-item">🛏️ My Room</a>
            <a href="fees.html"       class="nav-item">💳 Fee Status</a>
            <a href="complaints.html" class="nav-item active">📝 My Complaints</a>
            <a href="../index.html"   class="nav-item logout-item" id="logout-btn">🚪 Logout</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div class="topbar-title">
                <h1>My Complaints &amp; Requests</h1>
                <p>Report hostel issues and track your ticket status in real time</p>
            </div>
            <div class="user-profile">
                <span class="avatar">🎓</span>
                <span class="username" id="topbar-name">Student</span>
            </div>
        </header>

        <div class="content-row">

            <!-- Left: Submit Complaint Form -->
            <section class="card-box">
                <div class="section-header">
                    <h2>📝 Submit a New Complaint</h2>
                </div>

                <form id="complaint-form">
                    <div class="form-group">
                        <label for="complaint-category">Issue Category</label>
                        <select id="complaint-category" class="form-control" required>
                            <option value="" disabled selected>-- Select category --</option>
                            <option value="Electrical">Electrical (Fan, Light, Switch)</option>
                            <option value="Plumbing">Plumbing (Tap, Leakage, Flush)</option>
                            <option value="Internet">Internet / Wi-Fi</option>
                            <option value="Cleanliness">Room / Floor Cleanliness</option>
                            <option value="Furniture">Furniture / Bed</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Room Number</label>
                        <input type="text" id="complaint-room" class="form-control" readonly>
                    </div>

                    <div class="form-group">
                        <label for="complaint-title">Subject / Short Title</label>
                        <input type="text" id="complaint-title" class="form-control"
                            placeholder="e.g. Ceiling fan making loud noise" required>
                    </div>

                    <div class="form-group">
                        <label for="complaint-desc">Detailed Description</label>
                        <textarea id="complaint-desc" class="form-control"
                            placeholder="Describe your issue so staff can bring the right tools..." required></textarea>
                    </div>

                    <p id="form-msg" style="font-size:13px;margin-bottom:10px;"></p>
                    <button type="submit" class="btn-submit">🚀 Submit Complaint</button>
                </form>
            </section>

            <!-- Right: My Previous Complaints -->
            <section class="card-box">
                <div class="section-header">
                    <h2>📋 My Previous Complaints</h2>
                </div>
                <div id="complaints-container" style="display:flex;flex-direction:column;gap:16px;">
                    <p style="color:#94a3b8;font-size:14px;">Loading...</p>
                </div>
            </section>

        </div>

    </main>
</div>

<script>
    const API    = 'http://127.0.0.1:8000';
    const name   = localStorage.getItem('userName');
    const rollNo = localStorage.getItem('userRoll');

    if (!localStorage.getItem('userRole') || localStorage.getItem('userRole') !== 'student') {
        window.location.href = '../index.html';
    }
    document.getElementById('topbar-name').textContent = name || 'Student';

    document.getElementById('logout-btn').addEventListener('click', e => {
        e.preventDefault(); localStorage.clear(); window.location.href = '../index.html';
    });

    // Pre-fill room number from student profile
    async function prefillRoom() {
        if (!rollNo) return;
        try {
            const res  = await fetch(`${API}/api/students/${rollNo}`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('complaint-room').value = data.student.room_no || '';
            }
        } catch(e) {}
    }

    // Load this student's past complaints
    async function loadComplaints() {
        if (!rollNo) {
            document.getElementById('complaints-container').innerHTML =
                '<p style="color:red;font-size:14px;">Log in to see your complaints.</p>';
            return;
        }
        try {
            const res  = await fetch(`${API}/api/complaints/student/${rollNo}`);
            const data = await res.json();
            const container = document.getElementById('complaints-container');

            if (data.complaints.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8;font-size:14px;">No complaints filed yet.</p>';
                return;
            }

            container.innerHTML = data.complaints.map(c => {
                const badgeClass = c.status === 'Resolved'    ? 'badge-resolved'
                                 : c.status === 'In Progress' ? 'badge-progress'
                                 : 'badge-pending';
                const date = c.date_filed ? new Date(c.date_filed).toLocaleDateString('en-IN') : '-';
                return `
                <div class="complaint-card">
                    <div class="complaint-header">
                        <span class="complaint-id">Ticket #CMP-${c.id}</span>
                        <span class="badge ${badgeClass}">${c.status}</span>
                    </div>
                    <h3 class="complaint-title">${c.title}</h3>
                    <p class="complaint-desc">${c.description}</p>
                    <div class="complaint-meta">
                        <span>Category: ${c.category}</span> •
                        <span>Filed: ${date}</span>
                    </div>
                </div>`;
            }).join('');
        } catch(e) {
            document.getElementById('complaints-container').innerHTML =
                '<p style="color:red;font-size:14px;">Error loading complaints. Is the server running?</p>';
        }
    }

    // Submit complaint form
    document.getElementById('complaint-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const msgEl = document.getElementById('form-msg');
        msgEl.style.color = '#64748b';
        msgEl.textContent = 'Submitting...';

        const payload = {
            student_name: name   || 'Unknown',
            roll_no:      rollNo || 'N/A',
            room_no:      document.getElementById('complaint-room').value,
            category:     document.getElementById('complaint-category').value,
            title:        document.getElementById('complaint-title').value,
            description:  document.getElementById('complaint-desc').value
        };

        try {
            const res  = await fetch(`${API}/api/complaints`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                msgEl.style.color = '#16a34a';
                msgEl.textContent = '✅ Complaint submitted! Ticket #CMP-' + data.id;
                this.reset();
                prefillRoom();   // re-fill the room field
                loadComplaints(); // refresh the right panel
            } else {
                msgEl.style.color = 'red';
                msgEl.textContent = 'Error: ' + (data.detail || 'Could not submit.');
            }
        } catch(e) {
            msgEl.style.color = 'red';
            msgEl.textContent = 'Cannot reach backend. Is the server running?';
        }
    });

    prefillRoom();
    loadComplaints();
</script>

</body>
</html>

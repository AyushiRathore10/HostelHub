<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub - My Room Details</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>

<div class="dashboard-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>🏢 HostelHub</h2>
            <span class="role-badge">Student Portal</span>
        </div>
        <nav class="sidebar-menu">
            <a href="dashboard.html"  class="nav-item">📊 Dashboard</a>
            <a href="room.html"       class="nav-item active">🛏️ My Room</a>
            <a href="fees.html"       class="nav-item">💳 Fee Status</a>
            <a href="complaints.html" class="nav-item">📝 My Complaints</a>
            <a href="../index.html"   class="nav-item logout-item" id="logout-btn">🚪 Logout</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div class="topbar-title">
                <h1>My Room Details</h1>
                <p>Your assigned room, bed, and roommate information</p>
            </div>
            <div class="user-profile">
                <span class="avatar">🎓</span>
                <span class="username" id="topbar-name">Student</span>
            </div>
        </header>

        <div class="content-row" id="room-content">
            <p style="padding:20px;color:#94a3b8;">Loading room details...</p>
        </div>

    </main>
</div>

<script>
    const API    = 'http://127.0.0.1:8000';
    const name   = localStorage.getItem('userName');
    const rollNo = localStorage.getItem('userRoll');

    if (!localStorage.getItem('userRole') || localStorage.getItem('userRole') !== 'student') {
        window.location.href = '../index.html';
    }
    document.getElementById('topbar-name').textContent = name || 'Student';

    document.getElementById('logout-btn').addEventListener('click', e => {
        e.preventDefault(); localStorage.clear(); window.location.href = '../index.html';
    });

    async function loadRoom() {
        if (!rollNo) {
            document.getElementById('room-content').innerHTML = '<p style="padding:20px;color:red;">Could not identify student. Please log in again.</p>';
            return;
        }
        try {
            const res  = await fetch(`${API}/api/students/${rollNo}`);
            const data = await res.json();
            if (!data.success) return;
            const me = data.student;

            // Get all students in the same room (roommates)
            const resAll  = await fetch(`${API}/api/students`);
            const dataAll = await resAll.json();
            const roommates = dataAll.students.filter(s => s.room_no === me.room_no && s.roll_no !== me.roll_no);

            // Get room details
            const resRoom  = await fetch(`${API}/api/rooms`);
            const dataRoom = await resRoom.json();
            const myRoom   = dataRoom.rooms.find(r => r.room_no === me.room_no) || {};

            const roomCard = `
            <section class="card-box">
                <div class="section-header"><h2>🛏️ Room Specifications</h2></div>
                <div class="info-list">
                    <div class="info-row"><span class="info-label">Room Number</span><strong>${me.room_no || 'Not assigned'}</strong></div>
                    <div class="info-row"><span class="info-label">Block &amp; Floor</span><strong>${myRoom.block ? 'Block ' + myRoom.block + ', Floor ' + myRoom.floor : '-'}</strong></div>
                    <div class="info-row"><span class="info-label">Assigned Bed</span><strong>Bed #${me.bed_no || '-'}</strong></div>
                    <div class="info-row"><span class="info-label">Room Type</span><strong>${myRoom.room_type || '-'}</strong></div>
                    <div class="info-row"><span class="info-label">Capacity</span><strong>${myRoom.capacity || '-'} Beds</strong></div>
                    <div class="info-row"><span class="info-label">Amenities</span><span>Fan, Study Table, Cupboard, Wi-Fi</span></div>
                </div>
            </section>`;

            const roommateCards = roommates.length > 0
                ? roommates.map(r => `
                    <section class="card-box">
                        <div class="section-header"><h2>🧑‍🎓 Roommate</h2></div>
                        <div class="profile-header">
                            <div class="profile-avatar-lg">👨‍💻</div>
                            <h3 class="profile-name">${r.name}</h3>
                            <p class="profile-subtitle">Bed #${r.bed_no}</p>
                        </div>
                        <div class="info-list">
                            <div class="info-row"><span class="info-label">Roll No</span><strong>${r.roll_no}</strong></div>
                            <div class="info-row"><span class="info-label">Course</span><strong>${r.course} - Year ${r.year}</strong></div>
                            <div class="info-row"><span class="info-label">Email</span><strong>${r.email}</strong></div>
                            <div class="info-row"><span class="info-label">Phone</span><strong>${r.phone || '-'}</strong></div>
                        </div>
                    </section>`).join('')
                : `<section class="card-box">
                        <div class="section-header"><h2>🧑‍🎓 Roommate</h2></div>
                        <p style="color:#94a3b8;font-size:14px;padding:10px 0;">No roommate assigned yet.</p>
                   </section>`;

            document.getElementById('room-content').innerHTML = roomCard + roommateCards;

        } catch(e) {
            document.getElementById('room-content').innerHTML = '<p style="padding:20px;color:red;">Error loading room details. Is the server running?</p>';
            console.error(e);
        }
    }

    loadRoom();
</script>

</body>
</html>

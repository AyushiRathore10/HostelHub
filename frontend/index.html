<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <!-- Header / Branding -->
        <div class="login-header">
            <h1>🏢 HostelHub</h1>
            <p>Hostel Management System</p>
        </div>

        <!-- Role Selection Cards -->
        <p class="section-title">Select your role to continue:</p>

        <div class="role-container">
            <div class="role-card" id="admin-card">
                <div class="role-icon">🛡️</div>
                <h3>Admin</h3>
                <p>Warden &amp; Staff</p>
            </div>
            <div class="role-card" id="student-card">
                <div class="role-icon">🎓</div>
                <h3>Student</h3>
                <p>Hostel Resident</p>
            </div>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <!-- Hidden field — stores which role is currently selected -->
            <input type="hidden" id="selected-role" value="student">

            <h2 id="form-heading">Student Login</h2>

            <div class="form-group">
                <label for="username">Username / Roll No:</label>
                <input type="text" id="username" name="username"
                    placeholder="Enter your Roll Number (e.g. CS202401)" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                    placeholder="Enter password" required>
            </div>

            <button type="submit" id="login-btn">Login →</button>

            <p id="error-message"></p>
        </form>

        <p style="text-align:center;font-size:12px;color:#999;margin-top:16px;">
            Demo — Admin: <strong>admin / admin123</strong> &nbsp;|&nbsp; Student: <strong>CS202401 / pass123</strong>
        </p>

    </div>

    <script src="login.js"></script>
</body>
</html>
